name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install "./sdk/python[mcp,test]" "mcp==2.3.0" "jsonschema>=4.18"
      - run: PYTHONPATH=sdk/python/src python -m oac.conformance vectors
      - name: core + MCP tests (other integrations skip without their extras)
        run: cd sdk/python && python -m pytest -q -rs
      - run: python tools/check_schemas.py
      - run: python examples/mcp-server/demo.py
      - name: vector generator agrees with the SDK
        run: python tools/make_vectors.py
      - name: the package builds
        if: matrix.python == '3.13'
        run: python -m pip install "build>=1.2" && python -m build --outdir dist-py sdk/python && ls dist-py

  browser-tools:
    # Playwright 1.58 does not support Chromium on ubuntu-latest (26.04) yet
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: python -m pip install "./sdk/python[browser,approver,test]" "mcp==2.3.0" "playwright==1.58.0"
      - run: python -m playwright install --with-deps chromium
      - name: Gated Browser and Approver (headless Chromium, local test site)
        run: cd sdk/python && python -m pytest -q tests/integrations/browser tests/integrations/approver

  agent-frameworks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: python -m pip install "./sdk/python[openai-agents,langgraph,test]" "openai-agents==0.24.0" "langgraph==1.2.16"
      - name: OpenAI Agents SDK (real Runner, scripted model) and LangGraph (real StateGraph)
        run: cd sdk/python && python -m pytest -q tests/integrations/openai_agents tests/integrations/langgraph

  typescript:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: type-check and build (TypeScript 7)
        run: npm run build
      - run: node src/conformance.ts ../../vectors
      - run: node dist/conformance.js ../../vectors
      - name: tests (core, MCP SDK v2 plug-in, Vercel AI SDK adapter)
        run: npm test
      - run: npm pack --dry-run
