name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install "cryptography>=42" "pytest>=8" "jsonschema>=4.18" "mcp==2.3.0" "anyio>=4"
      - run: PYTHONPATH=sdk/python/src python -m oac.conformance vectors
      - run: cd sdk/python && python -m pytest -q
      - run: python tools/check_schemas.py
      - run: python examples/mcp-server/demo.py
      - name: MCP Python plug-in (end to end through the official SDK)
        run: cd integrations/mcp-python && python -m pytest -q -p anyio
      - name: vector generator agrees with the SDK
        run: python tools/make_vectors.py
      - name: the six Python packages build
        if: matrix.python == '3.13'
        run: |
          python -m pip install "build>=1.2"
          for d in sdk/python integrations/mcp-python integrations/gated-browser integrations/approver integrations/openai-agents integrations/langgraph; do
            python -m build --outdir dist-py "$d"
          done
          ls dist-py

  browser-tools:
    # Playwright 1.58 does not support Chromium on ubuntu-latest (26.04) yet
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: python -m pip install "cryptography>=42" "pytest>=8" "mcp==2.3.0" "anyio>=4" "playwright==1.58.0"
      - run: python -m playwright install --with-deps chromium
      - name: Gated Browser (MCP SDK + OAC extension + headless Chromium + local test site)
        run: cd integrations/gated-browser && python -m pytest -q -p anyio
      - name: Approver (enrol, approve, decline in headless Chromium; browser-signed consent verified by the SDK)
        run: cd integrations/approver && python -m pytest -q

  agent-frameworks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: python -m pip install "cryptography>=42" "pytest>=8" "anyio>=4" "openai-agents==0.24.0" "langgraph==1.2.16"
      - name: OpenAI Agents SDK adapter (real Runner, scripted model)
        run: cd integrations/openai-agents && python -m pytest -q -p anyio
      - name: LangGraph adapter (real StateGraph, interrupt and resume)
        run: cd integrations/langgraph && python -m pytest -q

  typescript:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: type-check and build (TypeScript 7)
        run: npm run build --workspaces
      - run: node sdk/typescript/src/conformance.ts vectors
      - run: node sdk/typescript/dist/conformance.js vectors
      - name: tests (SDK, MCP SDK v2 plug-in, Vercel AI SDK adapter) against the built packages
        run: npm test --workspaces
      - run: npm pack --dry-run --workspaces
