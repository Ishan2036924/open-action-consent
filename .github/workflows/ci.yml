name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: dependencies from the hash-locked ci/test.txt
        run: python -m pip install --require-hashes -r ci/test.txt
      - name: the SDK itself, from a wheel built with the locked setuptools (nothing unhashed is fetched)
        run: python -m pip wheel --no-deps --no-build-isolation --wheel-dir dist ./sdk/python && python -m pip install --no-deps dist/*.whl
      - run: PYTHONPATH=sdk/python/src python -m oac.conformance vectors
      - name: core + MCP tests (other integrations skip without their extras)
        run: cd sdk/python && python -m pytest -q -rs
      - run: python tools/check_schemas.py
      - name: release notes come from the changelog, and the SDK version has a dated section
        run: python tools/test_release_notes.py
      - name: release signing fetches only bytes that match the registries' digests
        run: python tools/test_fetch_published.py
      - name: CI installs are hash-locked and the locks cover every SDK extra a job tests
        if: matrix.python == '3.13'
        run: python tools/check_ci_locks.py && python tools/test_check_ci_locks.py
      - name: ruff (SDK, tests, tools and examples; ruff from the lock)
        if: matrix.python == '3.13'
        run: python -m ruff check .
      - run: python examples/mcp-server/demo.py
      - name: vector generator agrees with the SDK
        run: python tools/make_vectors.py
      - name: the package builds
        if: matrix.python == '3.13'
        run: python -m build --no-isolation --outdir dist-py sdk/python && ls dist-py

  fuzz:
    # The property tests run in the jobs above at 100 examples each; this runs them ten times longer, seeded, and
    # checks that the Python and TypeScript JCS agree byte for byte on a seeded corpus.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OAC_FUZZ_EXAMPLES: "1000"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: dependencies from the hash-locked ci/test.txt
        run: python -m pip install --require-hashes -r ci/test.txt
      - name: the SDK itself, from a wheel built with the locked setuptools (nothing unhashed is fetched)
        run: python -m pip wheel --no-deps --no-build-isolation --wheel-dir dist ./sdk/python && python -m pip install --no-deps dist/*.whl
      - name: fast-check from the npm lockfile
        run: cd sdk/typescript && npm ci --ignore-scripts --no-audit --no-fund
      - name: Hypothesis (JCS, JWS, keys, shapes, verify_export, assess) and the Python vs TypeScript JCS check
        run: cd sdk/python && python -m pytest -q -rs tests/test_fuzz.py
      - name: fast-check (the same properties in TypeScript)
        run: cd sdk/typescript && node --test test/fuzz.test.ts

  browser-tools:
    # Playwright 1.58 does not support Chromium on ubuntu-latest (26.04) yet
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: dependencies from the hash-locked ci/browser.txt
        run: python -m pip install --require-hashes -r ci/browser.txt
      - name: the SDK itself, from a wheel built with the locked setuptools (nothing unhashed is fetched)
        run: python -m pip wheel --no-deps --no-build-isolation --wheel-dir dist ./sdk/python && python -m pip install --no-deps dist/*.whl
      - run: python -m playwright install --with-deps chromium
      - name: Gated Browser and Approver (headless Chromium, local test site)
        run: cd sdk/python && python -m pytest -q tests/integrations/browser tests/integrations/approver

  agent-frameworks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: dependencies from the hash-locked ci/agents.txt
        run: python -m pip install --require-hashes -r ci/agents.txt
      - name: the SDK itself, from a wheel built with the locked setuptools (nothing unhashed is fetched)
        run: python -m pip wheel --no-deps --no-build-isolation --wheel-dir dist ./sdk/python && python -m pip install --no-deps dist/*.whl
      - name: OpenAI Agents SDK (real Runner, scripted model) and LangGraph (real StateGraph)
        run: cd sdk/python && python -m pytest -q tests/integrations/openai_agents tests/integrations/langgraph

  litellm:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: dependencies from the hash-locked ci/litellm.txt (LiteLLM pinned to the tested release)
        run: python -m pip install --require-hashes -r ci/litellm.txt
      - name: the SDK itself, from a wheel built with the locked setuptools (nothing unhashed is fetched)
        run: python -m pip wheel --no-deps --no-build-isolation --wheel-dir dist ./sdk/python && python -m pip install --no-deps dist/*.whl
      - name: guardrail unit tests and end to end through the real LiteLLM MCP gateway (local stdio server)
        run: cd sdk/python && python -m pytest -q -rs tests/integrations/litellm
      - name: the guardrail's hook fuzzing, ten times longer (hostile tool names, arguments, metadata, headers, events)
        run: cd sdk/python && OAC_FUZZ_EXAMPLES=1000 python -m pytest -q tests/integrations/litellm/test_litellm_fuzz.py

  typescript:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: type-check and build (TypeScript 7)
        run: npm run build
      - run: node src/conformance.ts ../../vectors
      - run: node dist/conformance.js ../../vectors
      - name: tests (core, MCP SDK v2 plug-in, Vercel AI SDK adapter)
        run: npm test
      - run: npm pack --dry-run
