name: release

# Publishes `open-action-consent` to PyPI, and stages it on npm for a maintainer's approval, when a version tag (v0.2.0,
# ...) is pushed. No passwords or tokens are stored anywhere: PyPI and npm trust this repository's workflow directly
# ("trusted publishing"). See RELEASING.md.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  pypi:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: python -m pip install "build>=1.2" && python -m build --outdir dist sdk/python
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist

  npm:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - run: npm --version
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - run: npm test
      # npm only lets this workflow *stage* a version; a maintainer then approves it on npmjs.com (Staged Packages tab,
      # two-factor login), so a compromised workflow alone cannot release anything. Needs npm 11.15 or newer.
      - name: stage for approval (skipped if this version is already on npm)
        run: |
          version=$(node -p "require('./package.json').version")
          if npm view "open-action-consent@$version" version >/dev/null 2>&1; then echo "skip: already published"; exit 0; fi
          npm stage publish --access public --provenance
