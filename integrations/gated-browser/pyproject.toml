[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oac-gated-browser"
version = "0.1.0"
description = "An MCP browser for agents that stops before every final click (Open Action Consent)"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = ["mcp>=2.3,<3", "playwright>=1.50", "cryptography>=42"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "../mcp-python/src", "../../sdk/python/src"]
testpaths = ["tests"]
