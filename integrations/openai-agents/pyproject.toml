[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oac-openai-agents"
version = "0.1.0"
description = "Open Action Consent for the OpenAI Agents SDK"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = ["openai-agents>=0.24,<0.30", "cryptography>=42"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "../../sdk/python/src"]
testpaths = ["tests"]
