[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oac-langgraph"
version = "0.1.0"
description = "Open Action Consent for LangGraph"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = ["langgraph>=1.2,<2", "cryptography>=42"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "../../sdk/python/src"]
testpaths = ["tests"]
