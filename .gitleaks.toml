# The conformance vectors are JWS tokens signed with public test keys (oac.testing.vector_key); they look like JWTs on
# purpose. Only that rule, only in vectors/, is allowed. Everything else uses gitleaks' default rules.
[extend]
useDefault = true

[[allowlists]]
description = "OAC test vectors: JWS signed with published test keys"
targetRules = ["jwt"]
paths = ['''^vectors/[a-z-]+\.json$''']
